[workspace]
members = [
    "microkernel",
    "servers/ipc",
    "servers/fs-zfs",
    "servers/blkdrv",
    "servers/fsd",
    "servers/launchd",
    "servers/security",
    "servers/service-controller",
    "libs/zfs-core",
    "libs/abi",
    "installer",
    "recovery",
    "kernel",
    "userland/commands",
    "userland/libfsclient",
    "userland/libblkclient",
    "userland/user_app",
    "userland/userlib",
    "userland/useralloc",
    "xtask",
    "bootloader-uefi",
    "tools",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://example.org/zero-os"
repository = "https://example.org/zero-os.git"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[workspace.dependencies]
spin = "0.9"
log = { version = "0.4", default-features = false, features = ["max_level_debug"] }
bitflags = "2"
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
