[package]
name = "zero-fsd"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "zero-fsd"
path = "src/bin/main.rs"

[dependencies]
# 块后端卷文件服务：纯 IPC + 静态表，无堆依赖（heapless/log 已随旧实现移除）。
zero-abi = { path = "../../libs/abi" }
spin = { workspace = true }
userlib = { path = "../../userland/userlib" }

useralloc = { path = "../../userland/useralloc" }
